# Configuration for aap-ee-inspector.
# Secrets (AAP_API_TOKEN, AAP_BASE_URL) stay in .env; this file is for
# non-secret settings that are safe to commit and tweak per environment.

[api]
execution_environments_path = "/api/controller/v2/execution_environments/"

[output]
dir = "outputs"
# Fields to keep in execution_environments.json. Comment out / remove to
# keep every field returned by the AAP API.
fields = ["name", "image", "description"]
# Opt-in: also run `pip list` inside each EE image during inspection and
# record installed Python packages. Off by default since the package list
# can be very large (hundreds of transitive dependencies) and significantly
# bloats output files. Can also be enabled per-run with `aap-ee-inspect --pip-list`.
include_pip_packages = false

[container]
# Container engine used to pull/run/remove EE images. Must be one of
# "podman" or "docker", and the corresponding CLI must be installed and
# running. Podman and Docker share compatible pull/run/rmi command syntax,
# so this is a drop-in swap.
engine = "podman"

[exclusions]
# Glob patterns (fnmatch syntax) matched against the full image reference.
# An image is skipped if it matches any pattern here. Plain strings with no
# glob characters (*, ?, [...]) work too, matching only that exact image.
# Example: skip a specific image, or a whole family with a wildcard.
images = []
# images = ["*/amfam_default:1.0", "registry.example.com/some/pinned@sha256:..."]

# Glob patterns (fnmatch syntax) matched against EE names. An image is
# skipped if any of its associated EE names match any pattern here.
# Example: skip every tag of the "rhel6_env" family and AAP's built-in EEs.
name_patterns = [
    "rhel6_env:*",
    "Default execution environment",
    "Control Plane Execution Environment",
    "Minimal execution environment",
]

[cache]
# By default, every image is pulled, inspected, and removed again after
# inspection to reclaim disk space. Set keep_all = true to keep every image
# cached locally instead, which speeds up subsequent runs at the cost of
# disk space (roughly 1-2GB per unique image, though EE version tags that
# share base layers cost less than their full size suggests). Can also be
# toggled per-run with `aap-ee-inspect --keep-cache`.
keep_all = false

# Glob patterns (fnmatch syntax) matched against the full image reference.
# An image is kept cached if it matches any pattern here, regardless of
# keep_all. Plain strings with no glob characters work too, matching only
# that exact image.
# Example: keep every version of the "amfam_default" EE family cached.
images = []
# images = ["*/amfam_default:*"]

# Glob patterns (fnmatch syntax) matched against EE names. An image is kept
# cached if any of its associated EE names match any pattern here.
name_patterns = []
